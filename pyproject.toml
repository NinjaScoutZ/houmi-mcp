[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "houmi-mcp"
version = "1.0.0"
description = "Houmi Autonomous Engineering MCP & Skills Suite (Fable5 + Godkiller + Graft + Diagram Design)"
readme = "README.md"
authors = [{ name = "NinjaScoutZ" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.2.0",
    "fastmcp>=0.4.0",
]

[project.scripts]
houmi-mcp = "houmi_mcp.server:mcp.run"

[tool.setuptools.packages.find]
where = ["src"]
